<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whack-a-Mole</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="decor-flowers" aria-hidden="true">
  <span class="flower pink"   style="left:6%;  top:68%; --s:1;"></span>
  <span class="flower white"  style="left:16%; top:82%; --s:.8;"></span>
  <span class="flower purple" style="left:4%;  top:90%; --s:1.1;"></span>
  <span class="flower yellow" style="left:88%; top:70%; --s:.9;"></span>
  <span class="flower pink"   style="left:94%; top:85%; --s:1;"></span>
  <span class="flower white"  style="left:80%; top:92%; --s:.7;"></span>
  <span class="flower purple" style="left:10%; top:60%; --s:.6;"></span>
  <span class="flower yellow" style="left:90%; top:60%; --s:.6;"></span>
</div>
<div class="wrap">
  <h1>🐹 Whack-a-Mole</h1>


  <div class="panel">
    <div class="stat">Score: <span id="score">0</span></div>
    <div class="stat">High Score: <span id="highScore">0</span></div>
    <div class="stat">Time: <span id="timeLeft">50</span>s</div>
    <div class="controls">
      <select id="difficulty">
        <option value="10">Easy (10s)</option>
        <option value="7" selected>Medium (7s)</option>
        <option value="5">Hard (5s)</option>
      </select>
      <button id="startBtn">Start</button>
      <button id="musicBtn">🔈 Music</button>
    </div>
  </div>

  <div class="msg" id="msg">Pick a difficulty and hit Start!</div>

  <div class="board" id="board">
    <div class="board-decor" aria-hidden="true">
      <span class="tuft" style="left:4%;  top:6%;  transform:scale(.9) rotate(-6deg);"></span>
      <span class="tuft" style="left:50%; top:3%;  transform:scale(1.1) rotate(4deg);"></span>
      <span class="tuft" style="left:94%; top:7%;  transform:scale(.8) rotate(8deg);"></span>
      <span class="tuft" style="left:2%;  top:50%; transform:scale(1) rotate(10deg);"></span>
      <span class="tuft" style="left:97%; top:48%; transform:scale(.9) rotate(-10deg);"></span>
      <span class="tuft" style="left:6%;  top:94%; transform:scale(1.1) rotate(-4deg);"></span>
      <span class="tuft" style="left:48%; top:97%; transform:scale(.85) rotate(6deg);"></span>
      <span class="tuft" style="left:92%; top:93%; transform:scale(1) rotate(-8deg);"></span>
      <span class="tuft" style="left:28%; top:24%; transform:scale(.6) rotate(3deg);"></span>
      <span class="tuft" style="left:72%; top:26%; transform:scale(.55) rotate(-5deg);"></span>
      <span class="tuft" style="left:26%; top:74%; transform:scale(.6) rotate(-3deg);"></span>
      <span class="tuft" style="left:74%; top:72%; transform:scale(.55) rotate(5deg);"></span>

      <span class="flower small pink"   style="left:10%; top:16%;"></span>
      <span class="flower small white"  style="left:88%; top:18%;"></span>
      <span class="flower small purple" style="left:14%; top:84%;"></span>
      <span class="flower small yellow" style="left:86%; top:82%;"></span>
      <span class="flower small white"  style="left:50%; top:92%;"></span>
    </div>
  </div>

  <footer>9 holes · click the mole before it hides · self-contained HTML/CSS/JS</footer>
</div>

<script src="script.js"></script>
</body>
</html>
